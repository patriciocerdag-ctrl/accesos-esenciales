<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Deseos para Begoña</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background-color: #f9f9f9; }
        table { border-collapse: collapse; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); background: white; }
        th, td { border: 1px solid #ccc; padding: 12px; text-align: left; }
        th { background-color: #444; color: white; }
        button { 
            padding: 10px 25px; cursor: pointer; background-color: #28a745; 
            color: white; border: none; border-radius: 4px; font-size: 16px; margin-bottom: 20px;
        }
        button:hover { background-color: #218838; }
        #status { margin-bottom: 10px; color: #555; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Begoña: Lista de deseos</h1>
    <button onclick="cargarDatos()">🔄 Actualizar lista de deseos</button>
    <div id="status">Listo.</div>

    <table id="tablaDatos">
        <thead>
            <tr id="headers"></tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
    </table>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzBLy43_S5xypgdhxW9YWKSWlg1OS3iDadQ2s6JA2OtSG7oVc32PtbfBIF6rguqEjuLLA/exec"; // REEMPLAZA ESTO

        async function cargarDatos() {
            const status = document.getElementById('status');
            const cuerpo = document.getElementById('cuerpoTabla');
            const headersRow = document.getElementById('headers');
            
            status.innerText = "⏳ Cargando colores y datos...";
            
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();

                if (data.length > 0) {
                    cuerpo.innerHTML = "";
                    headersRow.innerHTML = "";

                    // Crear cabeceras
                    const columnas = Object.keys(data[0]);
                    columnas.forEach(col => {
                        const th = document.createElement('th');
                        th.innerText = col;
                        headersRow.appendChild(th);
                    });

                    // Llenar filas aplicando los colores
                    data.forEach(fila => {
                        const tr = document.createElement('tr');
                        columnas.forEach(col => {
                            const td = document.createElement('td');
                            const celdaInfo = fila[col];
                            
                            td.innerText = celdaInfo.valor;
                            // Aplicar estilos directamente desde los datos de Sheets
                            td.style.backgroundColor = celdaInfo.fondo;
                            td.style.color = celdaInfo.texto;
                            
                            tr.appendChild(td);
                        });
                        cuerpo.appendChild(tr);
                    });
                    status.innerText = "✅ Datos actualizados.";
                }
            } catch (error) {
                console.error(error);
                status.innerText = "❌ Error al cargar.";
            }
        }

        window.onload = cargarDatos;
    </script>
</body>
</html>
